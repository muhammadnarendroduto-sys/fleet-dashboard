<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>KPI Fleet Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="KPI Fleet"/>
<meta name="theme-color" content="#4F46E5"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
:root {
  --bg:#F4F6FA; --white:#FFFFFF; --text:#1A1D23; --text2:#6B7280; --text3:#9CA3AF;
  --border:#E5E7EB; --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 16px rgba(0,0,0,.1); --sw:220px;
  --indigo:#4F46E5; --indigo-bg:#EEF2FF; --indigo-text:#3730A3;
  --green:#10B981; --green-bg:#ECFDF5; --green-text:#065F46;
  --red:#EF4444; --red-bg:#FEF2F2; --red-text:#991B1B;
  --amber:#F59E0B; --amber-bg:#FFFBEB; --amber-text:#92400E;
  --blue:#3B82F6; --blue-bg:#EFF6FF; --blue-text:#1E40AF;
  --purple:#8B5CF6; --purple-bg:#F5F3FF; --purple-text:#5B21B6;
  --orange:#F97316; --orange-bg:#FFF7ED; --orange-text:#9A3412;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;display:flex;min-height:100vh;min-height:100dvh;}

/* SIDEBAR */
.sidebar{width:var(--sw);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s;}
.sb-logo{padding:1.1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem;}
.sb-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.sb-name{font-size:.8rem;font-weight:700;color:var(--text);line-height:1.25;}
.sb-name span{display:block;font-size:.65rem;font-weight:400;color:var(--text2);}
.sb-nav{padding:.75rem .65rem;flex:1;overflow-y:auto;}
.nav-lbl{font-size:.6rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:0 .65rem;margin:.9rem 0 .35rem;}
.nav-item{display:flex;align-items:center;gap:.55rem;padding:.52rem .65rem;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.on{background:var(--indigo-bg);color:var(--indigo);}
.nav-item .badge-count{margin-left:auto;background:var(--red);color:white;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:999px;min-width:18px;text-align:center;}
.sb-foot{padding:.85rem 1.25rem;border-top:1px solid var(--border);}
.live-pill{display:inline-flex;align-items:center;gap:.35rem;color:var(--green-text);font-size:.68rem;font-weight:500;}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 2s infinite;flex-shrink:0;}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.4}}
.sb-time{font-size:.64rem;color:var(--text3);margin-top:.25rem;}

/* MAIN */
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

/* TOPBAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;gap:1rem;}
.tb-left{display:flex;align-items:center;gap:.5rem;min-width:0;}
.tb-title{font-size:.88rem;font-weight:600;color:var(--text);white-space:nowrap;}
.tb-sub{font-size:.75rem;color:var(--text3);white-space:nowrap;}
.tb-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.sync-meta{text-align:right;font-size:.68rem;color:var(--text3);line-height:1.5;}
.sync-meta strong{display:block;color:var(--text2);font-size:.7rem;font-weight:500;}
.cd-pill{padding:.25rem .65rem;border-radius:999px;background:var(--green-bg);color:var(--green-text);font-size:.67rem;font-weight:600;border:1px solid #A7F3D0;display:flex;align-items:center;gap:.3rem;white-space:nowrap;}
.cd-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);animation:lp 2s infinite;}
.btn-ref{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border-radius:8px;background:var(--indigo);color:white;font-size:.75rem;font-weight:500;cursor:pointer;border:none;transition:background .2s;font-family:'Inter',sans-serif;white-space:nowrap;}
.btn-ref:hover{background:#4338CA;}
.btn-ref.loading svg{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* CONTENT */
.content{padding:1.5rem;flex:1;}
.sec-title{font-size:.75rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.75rem;}

/* STATUS CARDS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem;margin-bottom:1.5rem;}
.sc{border-radius:12px;padding:1rem 1.1rem;border:1px solid transparent;transition:transform .2s,box-shadow .2s;cursor:default;}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh2);}
.sc-icon{font-size:1.3rem;margin-bottom:.6rem;display:block;}
.sc-val{font-size:1.9rem;font-weight:700;line-height:1;margin-bottom:.2rem;}
.sc-lbl{font-size:.7rem;font-weight:600;opacity:.8;}
.sc-pct{font-size:.63rem;opacity:.65;margin-top:.1rem;}
.c-teal{background:#E6FAF8;border-color:#99F6E4;}.c-teal .sc-val{color:#0F766E;}
.c-red{background:var(--red-bg);border-color:#FECACA;}.c-red .sc-val{color:var(--red-text);}
.c-amber{background:var(--amber-bg);border-color:#FDE68A;}.c-amber .sc-val{color:var(--amber-text);}
.c-purple{background:var(--purple-bg);border-color:#DDD6FE;}.c-purple .sc-val{color:var(--purple-text);}
.c-blue{background:var(--blue-bg);border-color:#BFDBFE;}.c-blue .sc-val{color:var(--blue-text);}
.c-indigo{background:var(--indigo-bg);border-color:#C7D2FE;}.c-indigo .sc-val{color:var(--indigo-text);}

/* KPI */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem;}
@media(max-width:600px){.kgrid{grid-template-columns:1fr}}
.kc{background:var(--white);border-radius:12px;padding:1.25rem 1.4rem;box-shadow:var(--sh);border:1px solid var(--border);}
.kc.kpass{border-left:4px solid var(--green);}.kc.kfail{border-left:4px solid var(--red);}
.kh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;gap:.5rem;flex-wrap:wrap;}
.klbl{font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:999px;font-size:.65rem;font-weight:700;}
.badge.pass{background:var(--green-bg);color:var(--green-text);border:1px solid #A7F3D0;}
.badge.fail{background:var(--red-bg);color:var(--red-text);border:1px solid #FECACA;}
.knum{display:flex;align-items:baseline;gap:.45rem;margin-bottom:.7rem;}
.kbig{font-size:2rem;font-weight:700;line-height:1;}
.ktgt{font-size:.74rem;color:var(--text3);}
.pt{height:7px;background:#F3F4F6;border-radius:999px;position:relative;margin-bottom:.35rem;}
.pf{height:100%;border-radius:999px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.pm{position:absolute;top:-4px;bottom:-4px;width:2px;background:#D1D5DB;border-radius:2px;}
.pl{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text3);}
.knote{margin-top:.75rem;padding:.45rem .8rem;border-radius:7px;font-size:.72rem;font-weight:500;}
.knote.pass{background:var(--green-bg);color:var(--green-text);}
.knote.fail{background:var(--red-bg);color:var(--red-text);}

/* MID GRID */
.mgrid{display:grid;grid-template-columns:260px 1fr;gap:.75rem;margin-bottom:1.5rem;}
@media(max-width:860px){.mgrid{grid-template-columns:1fr}}
.card{background:var(--white);border-radius:12px;padding:1.1rem 1.25rem;box-shadow:var(--sh);border:1px solid var(--border);}
.card h3{font-size:.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.85rem;}
.rlist{display:flex;flex-direction:column;gap:.5rem;}
.ri{display:flex;align-items:center;gap:.6rem;}
.rn{font-size:.7rem;color:var(--text2);width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rbw{flex:1;height:5px;background:#F3F4F6;border-radius:999px;overflow:hidden;}
.rb{height:100%;border-radius:999px;background:#818CF8;transition:width .6s;}
.rc{font-size:.7rem;font-weight:600;color:var(--text);width:22px;text-align:right;flex-shrink:0;}
.rbd{font-size:.62rem;color:var(--red-text);width:45px;flex-shrink:0;}

/* TABLE */
.tcard{background:var(--white);border-radius:12px;padding:1.1rem 1.25rem;box-shadow:var(--sh);border:1px solid var(--border);overflow-x:auto;}
.tcard h3{font-size:.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem;}
.fstrip{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center;}
.fb{padding:.24rem .7rem;border-radius:999px;border:1px solid var(--border);background:var(--white);color:var(--text2);font-size:.69rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;}
.fb:hover{border-color:var(--indigo);color:var(--indigo);}
.fb.on{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo);}
.sbox{margin-left:auto;padding:.26rem .7rem;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.7rem;font-family:'Inter',sans-serif;outline:none;width:160px;transition:border-color .2s;}
.sbox::placeholder{color:var(--text3);}
.sbox:focus{border-color:var(--indigo);}
table{width:100%;border-collapse:collapse;font-size:.77rem;min-width:520px;}
thead tr{border-bottom:2px solid var(--bg);}
thead th{padding:.45rem .65rem;text-align:left;color:var(--text3);font-weight:600;font-size:.63rem;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--bg);transition:background .1s;}
tbody tr:hover{background:#F9FAFB;}
tbody td{padding:.52rem .65rem;color:var(--text);white-space:nowrap;}
tbody td.d{color:var(--text2);}
.pill{display:inline-block;padding:.16rem .55rem;border-radius:999px;font-size:.64rem;font-weight:700;}
.pREADY{background:var(--green-bg);color:var(--green-text);}
.pBREAKDOWN{background:var(--red-bg);color:var(--red-text);}
.pMANGKRAK{background:var(--amber-bg);color:var(--amber-text);}
.pLAKA{background:var(--purple-bg);color:var(--purple-text);}
.pPROGRES{background:var(--blue-bg);color:var(--blue-text);}
.pgrow{display:flex;align-items:center;justify-content:space-between;margin-top:.75rem;flex-wrap:wrap;gap:.4rem;}
.pginfo{font-size:.67rem;color:var(--text3);}
.pgbtns{display:flex;gap:.25rem;}
.pgb{padding:.24rem .55rem;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text2);font-size:.69rem;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;}
.pgb:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo);}
.pgb:disabled{opacity:.3;cursor:default;}
.pgb.on{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo);}

/* ── WORKSHOP TRACKING ── */
.ws-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.65rem;margin-bottom:1.25rem;}
.ws-stat{border-radius:11px;padding:.85rem 1rem;border:1px solid transparent;text-align:center;}
.ws-stat .ws-val{font-size:1.7rem;font-weight:700;line-height:1;margin-bottom:.2rem;}
.ws-stat .ws-lbl{font-size:.65rem;font-weight:600;opacity:.8;}
.wss-total{background:var(--indigo-bg);border-color:#C7D2FE;}.wss-total .ws-val{color:var(--indigo-text);}
.wss-part{background:var(--red-bg);border-color:#FECACA;}.wss-part .ws-val{color:var(--red-text);}
.wss-proses{background:var(--amber-bg);border-color:#FDE68A;}.wss-proses .ws-val{color:var(--amber-text);}
.wss-inspeksi{background:var(--blue-bg);border-color:#BFDBFE;}.wss-inspeksi .ws-val{color:var(--blue-text);}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.5rem;}
@media(max-width:700px){.kanban{grid-template-columns:1fr}}
.kb-col{background:var(--bg);border-radius:12px;padding:.85rem;}
.kb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.kb-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.kb-count{font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;}
.kb-part .kb-title{color:var(--red-text);}.kb-part .kb-count{background:var(--red-bg);color:var(--red-text);}
.kb-proses .kb-title{color:var(--amber-text);}.kb-proses .kb-count{background:var(--amber-bg);color:var(--amber-text);}
.kb-inspeksi .kb-title{color:var(--blue-text);}.kb-inspeksi .kb-count{background:var(--blue-bg);color:var(--blue-text);}

.ws-card{background:var(--white);border-radius:10px;padding:.85rem 1rem;margin-bottom:.55rem;box-shadow:var(--sh);border:1px solid var(--border);border-left-width:3px;}
.ws-card.wc-part{border-left-color:var(--red);}
.ws-card.wc-proses{border-left-color:var(--amber);}
.ws-card.wc-inspeksi{border-left-color:var(--blue);}
.wc-nopol{font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:.25rem;}
.wc-jenis{font-size:.68rem;color:var(--text2);margin-bottom:.4rem;}
.wc-meta{display:flex;flex-wrap:wrap;gap:.4rem;}
.wc-tag{font-size:.62rem;padding:.14rem .5rem;border-radius:999px;background:var(--bg);color:var(--text2);border:1px solid var(--border);}
.wc-days{font-size:.62rem;font-weight:600;padding:.14rem .5rem;border-radius:999px;}
.days-ok{background:var(--green-bg);color:var(--green-text);}
.days-warn{background:var(--amber-bg);color:var(--amber-text);}
.days-over{background:var(--red-bg);color:var(--red-text);}
.kb-empty{text-align:center;padding:1.5rem;color:var(--text3);font-size:.75rem;}

/* ERR */
.err-bar{background:var(--red-bg);border:1px solid #FECACA;border-radius:9px;padding:.7rem 1rem;margin-bottom:1rem;font-size:.75rem;color:var(--red-text);display:none;align-items:center;gap:.5rem;}

/* LOADING */
.state-box{text-align:center;padding:4rem 2rem;color:var(--text3);}

/* ── ANALITIK ── */
.pivot-section{margin-bottom:2rem;}
.pivot-section h3{font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:.75rem;}
.pivot-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow-x:auto;box-shadow:var(--sh);}
.pivot-table{border-collapse:collapse;font-size:.75rem;min-width:100%;}
.pivot-table th{background:#1E2761;color:#fff;padding:.45rem .7rem;text-align:center;font-weight:600;font-size:.68rem;white-space:nowrap;}
.pivot-table th.row-hdr{text-align:left;min-width:120px;}
.pivot-table td{padding:.4rem .65rem;border-bottom:1px solid var(--bg);text-align:center;color:var(--text2);}
.pivot-table td.row-label{text-align:left;font-weight:600;color:var(--text);background:var(--bg);}
.pivot-table td.grand{font-weight:700;color:var(--text);background:#EEF2FF;}
.pivot-table tr.grand-row td{font-weight:700;background:#1E2761;color:#fff;}
.pivot-table tr:hover td:not(.row-label){background:#F0F4FF;}
.pivot-table td.val-hi{color:#065F46;font-weight:600;}
.pivot-table td.val-bd{color:#991B1B;font-weight:600;}
.charts-analitik{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem;}
@media(max-width:860px){.charts-analitik{grid-template-columns:1fr;}}
.chart-card-a{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;box-shadow:var(--sh);}
.chart-card-a h3{font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.85rem;}
.pv-cell{transition:background .15s;}
.pv-cell:hover{background:#EEF2FF!important;color:#3730A3!important;font-weight:700;}
.pv-active{background:#DBEAFE!important;color:#1E40AF!important;font-weight:700;outline:2px solid #3B82F6;}
.drill-badge{display:flex;align-items:center;justify-content:space-between;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:.65rem 1rem;margin-bottom:1rem;font-size:.8rem;color:#1E40AF;gap:.75rem;flex-wrap:wrap;}
.drill-clear{background:#1E2761;color:#fff;border:none;padding:.3rem .85rem;border-radius:7px;font-size:.75rem;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
.drill-clear:hover{background:#3B82F6;}
.drill-empty{text-align:center;padding:2rem;color:#9CA3AF;font-size:.82rem;}
#branchChart{cursor:pointer;}

/* ── UPDATE STATUS TAB ── */
.upd-wrap{max-width:520px;margin:0 auto;padding:.5rem 0 2rem;}
.upd-search-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);}
.upd-search-box h3{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem;}
.upd-input{width:100%;padding:.65rem .9rem;border-radius:10px;border:1.5px solid var(--border);font-size:.95rem;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.upd-input:focus{border-color:var(--indigo);}
.upd-results{margin-top:.65rem;display:flex;flex-direction:column;gap:.45rem;max-height:260px;overflow-y:auto;}
.upd-result-item{padding:.7rem 1rem;border-radius:10px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
.upd-result-item:hover{border-color:var(--indigo);background:var(--indigo-bg);}
.upd-result-item.active{border-color:var(--indigo);background:var(--indigo-bg);}
.upd-nopol{font-weight:700;font-size:.9rem;color:var(--text);}
.upd-meta{font-size:.72rem;color:var(--text2);margin-top:.18rem;}
.upd-form{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:1.3rem;margin-bottom:1rem;box-shadow:var(--sh);animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.upd-form-title{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1rem;}
.upd-unit-card{background:var(--bg);border-radius:10px;padding:.85rem 1rem;margin-bottom:1.1rem;display:grid;grid-template-columns:1fr 1fr;gap:.35rem .75rem;}
.upd-unit-card .uc-row{display:flex;flex-direction:column;gap:.1rem;}
.upd-unit-card .uc-label{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.upd-unit-card .uc-val{font-size:.82rem;font-weight:600;color:var(--text);}
.upd-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.1rem;}
.upd-st-btn{padding:.65rem .4rem;border-radius:10px;border:2px solid var(--border);background:var(--white);cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;}
.upd-st-btn .st-icon{font-size:1.3rem;display:block;margin-bottom:.25rem;}
.upd-st-btn .st-label{font-size:.7rem;font-weight:700;display:block;}
.upd-st-btn.sel-READY{border-color:#10B981;background:#ECFDF5;} .upd-st-btn.sel-READY .st-label{color:#065F46;}
.upd-st-btn.sel-BREAKDOWN{border-color:#EF4444;background:#FEF2F2;} .upd-st-btn.sel-BREAKDOWN .st-label{color:#991B1B;}
.upd-st-btn.sel-MANGKRAK{border-color:#F59E0B;background:#FFFBEB;} .upd-st-btn.sel-MANGKRAK .st-label{color:#92400E;}
.upd-st-btn.sel-LAKA{border-color:#8B5CF6;background:#F5F3FF;} .upd-st-btn.sel-LAKA .st-label{color:#5B21B6;}

<script>
const API_URL   = "https://script.google.com/macros/s/AKfycbw9mZ4NDk1sZMAYkwDf7x1fZOOj9E8eI1cH-F48ipP6QAiERmutm9FDidv7ARDtqmBf7g/exec";
const API_URL_V = API_URL; // same script, vendor returned in json.vendor
const REFRESH_MS= 5*60*1000, KPI_R=90, KPI_B=10, PG=15;

let allUnits=[],filteredUnits=[],wsUnits=[];
let vendorUnits=[],activeSheet='investasi'; // 'investasi' or 'vendor'
let curFilter="ALL",curPage=1,searchQ="",curTab="kpi";
let filterBisnis="",filterBisDet="",filterRute="",filterBranch="";
let donutChart=null,branchChart=null,cdLeft=REFRESH_MS,cdTimer=null,deferredPrompt=null;

// ── SIDEBAR MOBILE ───────────────────────────────────────
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── TABS ─────────────────────────────────────────────────
function showTab(t){
  curTab=t;
  document.getElementById('tab-kpi').style.display      = t==='kpi'     ?'block':'none';
  document.getElementById('tab-ws').style.display       = t==='ws'      ?'block':'none';
  document.getElementById('tab-analitik').style.display = t==='analitik'?'block':'none';
  document.getElementById('tab-update').style.display   = t==='update'  ?'block':'none';
  document.getElementById('nav-kpi').classList.toggle('on',      t==='kpi');
  document.getElementById('nav-ws').classList.toggle('on',       t==='ws');
  document.getElementById('nav-analitik').classList.toggle('on', t==='analitik');
  document.getElementById('nav-update').classList.toggle('on',   t==='update');
  const sheetLabel = activeSheet==='vendor'?'KBM Vendor':'KBM Investasi';
  const titles={kpi:'Dashboard Overview',ws:'Workshop Tracking',analitik:'Analitik Armada',update:'Update Status Unit'};
  const subs  ={kpi:sheetLabel,ws:'Status Perbaikan Unit',analitik:'Distribusi per Regional & Jenis',update:'Edit langsung dari HP'};
  document.getElementById('tbTitle').textContent = titles[t]||'';
  document.getElementById('tbSub').textContent   = subs[t]||'';
  if(t==='analitik'){
    if(allUnits.length>0){
      try{ renderAnalitik(); }
      catch(e){
        console.error('Analitik error:',e);
        document.getElementById('tab-analitik').innerHTML=
          '<div class="state-box"><div style="font-size:2rem">⚠️</div><h2>Error render analitik</h2><p style="font-size:.75rem">'+e.message+'</p><button onclick="renderAnalitik()" style="margin-top:1rem;padding:.5rem 1.2rem;border-radius:8px;background:var(--indigo);color:#fff;border:none;cursor:pointer;font-family:inherit">Coba Lagi</button></div>';
      }
    } else {
      document.getElementById('tab-analitik').innerHTML='<div class="state-box"><div class="spinner"></div><h2>Menunggu data...</h2></div>';
    }
  }
  if(t==='update') renderUpdateTab();
  // Hide BARU badge once visited
  const ub=document.getElementById('updateBadge');
  if(t==='update'&&ub) ub.style.display='none';
  closeSidebar();
}

// ── COUNTDOWN ────────────────────────────────────────────
function startCd(){
  clearInterval(cdTimer); cdLeft=REFRESH_MS;
  cdTimer=setInterval(()=>{
    cdLeft-=1000; if(cdLeft<0)cdLeft=REFRESH_MS;
    const m=Math.floor(cdLeft/60000),s=String(Math.floor((cdLeft%60000)/1000)).padStart(2,"0");
    const el=document.getElementById("cdPill"); if(el)el.textContent=`${m}:${s}`;
  },1000);
}

// ── FETCH ────────────────────────────────────────────────
async function loadData(){
  const btn=document.getElementById("btnRef");
  if(btn)btn.classList.add("loading");
  try{
    const res=await fetch(API_URL+"?t="+Date.now());
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const json=await res.json();

    // Parse KBM Investasi
    const kbmRows=json.kbm||json.data||json;
    let hIdx=-1;
    for(let i=0;i<Math.min(kbmRows.length,10);i++){
      const c=kbmRows[i].map(x=>String(x).toUpperCase().trim());
      if(c.includes("STATUS")&&c.includes("NOPOL")){hIdx=i;break;}
    }
    if(hIdx<0)throw new Error("Kolom STATUS/NOPOL tidak ditemukan.");
    const hdrs=kbmRows[hIdx].map(x=>String(x).toUpperCase().trim());
    const ci=n=>hdrs.indexOf(n), cip=p=>hdrs.findIndex(h=>h.includes(p));
    const cv=(r,i)=>i>=0&&i<r.length?String(r[i]||"").trim():"";
    const iSt=ci("STATUS"),iNo=ci("NOPOL"),iReg=cip("REGIONAL"),iTh=cip("TAHUN"),iJn=cip("JENIS"),iMr=ci("MEREK"),iBs=ci("BISNIS");
    const iBsDet=hdrs.findIndex(h=>h.includes("DETAIL"));
    const iRute=hdrs.findIndex(h=>h==="RUTE"||h.includes("RUTE"));
    const iBranch=hdrs.findIndex(h=>h.includes("BRANCH")||h==="BRANCH OFFICE");
    allUnits=[];
    for(let i=hIdx+1;i<kbmRows.length;i++){
      const r=kbmRows[i],st=cv(r,iSt).toUpperCase(),no=cv(r,iNo);
      if(!st||!no||st==="STATUS")continue;
      allUnits.push({
        status:st, nopol:no, regional:cv(r,iReg), tahun:cv(r,iTh),
        jenis:cv(r,iJn), merek:cv(r,iMr), bisnis:cv(r,iBs),
        bisnis_detail:iBsDet>=0?cv(r,iBsDet):"",
        rute:iRute>=0?cv(r,iRute):"",
        branch:iBranch>=0?cv(r,iBranch):""
      });
    }

    // Parse KBM Vendor
    vendorUnits=[];
    const vendorRows=json.vendor||[];
    if(vendorRows.length>1){
      let vhIdx=-1;
      for(let i=0;i<Math.min(vendorRows.length,10);i++){
        const c=vendorRows[i].map(x=>String(x).toUpperCase().trim());
        if(c.includes("STATUS")&&c.includes("NOPOL")){vhIdx=i;break;}
      }
      if(vhIdx>=0){
        const vhdrs=vendorRows[vhIdx].map(x=>String(x).toUpperCase().trim());
        const vci=n=>vhdrs.indexOf(n), vcip=p=>vhdrs.findIndex(h=>h.includes(p));
        const vcv=(r,i)=>i>=0&&i<r.length?String(r[i]||"").trim():"";
        const viSt=vci("STATUS"),viNo=vci("NOPOL"),viTh=vcip("TAHUN"),viJn=vcip("JENIS"),viMr=vcip("MEREK"),viBs=vcip("BISNIS");
        const viBsDet=vhdrs.findIndex(h=>h.includes("DETAIL"));
        const viRute=vhdrs.findIndex(h=>h==="RUTE"||h.includes("RUTE"));
        // Branch Office: cari kolom BRANCH OFFICE atau BRANCH
        const viBranch=vhdrs.findIndex(h=>h==="BRANCH OFFICE"||h.includes("BRANCH")||h==="REGIONAL OFFICE"||h.includes("REGIONAL"));
        const viKep=vhdrs.findIndex(h=>h.includes("KEPEMILIKAN")||h.includes("VENDOR"));
        for(let i=vhIdx+1;i<vendorRows.length;i++){
          const r=vendorRows[i],st=vcv(r,viSt).toUpperCase(),no=vcv(r,viNo);
          if(!st||!no||st==="STATUS")continue;
          const branchVal=viBranch>=0?vcv(r,viBranch):"";
          vendorUnits.push({
            status:st, nopol:no,
            branch:branchVal,
            regional:branchVal, // sama dengan branch untuk vendor
            tahun:vcv(r,viTh), jenis:vcv(r,viJn),
            merek:vcv(r,viMr), bisnis:vcv(r,viBs),
            bisnis_detail:viBsDet>=0?vcv(r,viBsDet):"",
            rute:viRute>=0?vcv(r,viRute):"",
            vendor:viKep>=0?vcv(r,viKep):""
          });
        }
      }
    }

    // Parse Workshop
    const wsRows=json.workshop||[];
    wsUnits=[];
    if(wsRows.length>1){
      const wh=wsRows[0].map(x=>String(x).toUpperCase().trim());
      const wi={no:0,nopol:1,kendaraan:2,keluhan:3,tgl:4,bengkel:5,progress:6,estimasi:7};
      for(let i=1;i<wsRows.length;i++){
        const r=wsRows[i];
        const no=String(r[wi.nopol]||"").trim();
        const prog=String(r[wi.progress]||"").trim().toUpperCase();
        if(!no)continue;
        const tglMasuk=r[wi.tgl]?new Date(r[wi.tgl]):null;
        const hariMasuk=tglMasuk?Math.floor((new Date()-tglMasuk)/(1000*60*60*24)):null;
        // Match nopol to KBM status
        const kbmUnit = allUnits.find(u=>u.nopol===no);
        wsUnits.push({
          no:r[wi.no], nopol:no, kendaraan:String(r[wi.kendaraan]||"").trim(),
          keluhan:String(r[wi.keluhan]||"").trim(), tgl:r[wi.tgl]?String(r[wi.tgl]).trim():"",
          bengkel:String(r[wi.bengkel]||"").trim(), progress:prog,
          estimasi:r[wi.estimasi]?String(r[wi.estimasi]).trim():"", hari:hariMasuk,
          kbmStatus: kbmUnit?kbmUnit.status:"BREAKDOWN"
        });
      }
    }

    // Update badge
    const bdg=document.getElementById("wsBadge");
    if(bdg&&wsUnits.length>0){bdg.style.display="inline-block";bdg.textContent=wsUnits.length;}

    const now=new Date();
    const ts=now.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})+" "+now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const el1=document.getElementById("syncTime"),el2=document.getElementById("syncSub"),el3=document.getElementById("sbTime");
    if(el1)el1.textContent=ts;
    if(el2)el2.textContent=`${allUnits.length} unit · ${activeSheet==="vendor"?"KBM VENDOR":json.sheet||"KBM INVESTASI NEW"}`;
    if(el3)el3.textContent="Update: "+ts;

    document.getElementById("errBar").style.display="none";
    setActiveUnits();
    startCd(); renderKPI(); renderWS();
    if(curTab==='analitik') renderAnalitik();
    if(curTab==='update') renderUpdateTab();
  }catch(e){
    const b=document.getElementById("errBar"); document.getElementById("errMsg").textContent=e.message; b.style.display="flex";
    if(allUnits.length===0) document.getElementById("tab-kpi").innerHTML=`<div class="state-box"><div style="font-size:2rem;margin-bottom:.6rem">⚠️</div><h2>Gagal memuat data</h2><p style="font-size:.78rem">${e.message}</p></div>`;
  }finally{
    if(btn)btn.classList.remove("loading");
  }
}

// ── SHEET SWITCHER ───────────────────────────────────────
function setActiveUnits(){
  if(activeSheet==='vendor'){
    allUnits = vendorUnits.length ? vendorUnits : allUnits;
  }
  // else allUnits already set from investasi parsing
}

function switchSheet(sheet){
  if(sheet===activeSheet) return;
  activeSheet=sheet;

  // Update button styles
  const bi=document.getElementById('btnSheetInv');
  const bv=document.getElementById('btnSheetVend');
  if(bi) bi.className='sh-btn'+(sheet==='investasi'?' sh-btn-on':'');
  if(bv) bv.className='sh-btn'+(sheet==='vendor'?' sh-btn-on':'');

  // Swap allUnits
  if(sheet==='vendor'){
    if(!vendorUnits.length){
      showToast('⏳ Data vendor belum dimuat, refresh dulu...','err');
      return;
    }
    allUnits=vendorUnits;
  } else {
    // reload investasi from scratch via loadData
    loadData();
    return;
  }

  // Reset filters
  curFilter="ALL"; curPage=1; searchQ="";
  filterBisnis=""; filterBisDet=""; filterRute=""; filterBranch="";
  aFilterStatus=''; aFilterBisnis=''; aFilterBisDet=''; aFilterBranch=''; aFilterSearch='';
  analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};
  analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};

  // Update topbar subtitle
  const el2=document.getElementById("syncSub");
  if(el2) el2.textContent=allUnits.length+' unit · KBM VENDOR';

  // Re-render active tab
  renderKPI();
  if(curTab==='ws') renderWS();
  if(curTab==='analitik') renderAnalitik();
  if(curTab==='update') renderUpdateTab();
}

// ── KPI TAB ──────────────────────────────────────────────
function renderKPI(){
  const total=allUnits.length;
  const bySt={},byBranch={},bdBranch={};
  allUnits.forEach(u=>{
    bySt[u.status]=(bySt[u.status]||0)+1;
    const br=u.branch||u.regional||'-';
    byBranch[br]=(byBranch[br]||0)+1;
    if(u.status==="BREAKDOWN")bdBranch[br]=(bdBranch[br]||0)+1;
  });
  const nR=bySt["READY"]||0,nB=bySt["BREAKDOWN"]||0,nM=bySt["MANGKRAK"]||0,nL=bySt["LAKA"]||0,nP=bySt["PROGRES"]||0;
  const pR=total?+(nR/total*100).toFixed(2):0, pB=total?+(nB/total*100).toFixed(2):0;
  const kR=pR>=KPI_R, kB=pB<=KPI_B;
  const gR=(pR-KPI_R).toFixed(1), gB=(pB-KPI_B).toFixed(1);
  const uGap=Math.ceil((KPI_R/100*total)-nR), bGap=Math.ceil((pB-KPI_B)/100*total);
  const branchSort=Object.entries(byBranch).sort((a,b)=>b[1]-a[1]);
  const pct=v=>total?(v/total*100).toFixed(1)+"%":"0%";

  document.getElementById("tab-kpi").innerHTML=`
  <div class="sec-title fu fu1">Fleet Status</div>
  <div class="sg fu fu1">
    ${[
      {l:"Ready",v:nR,p:pct(nR),c:"c-teal",i:"✈"},
      {l:"Breakdown",v:nB,p:pct(nB),c:"c-red",i:"⚠"},
      {l:"Mangkrak",v:nM,p:pct(nM),c:"c-amber",i:"⏸"},
      {l:"Laka",v:nL,p:pct(nL),c:"c-purple",i:"🔴"},
      {l:"Progres",v:nP,p:pct(nP),c:"c-blue",i:"🔄"},
      {l:"Total",v:total,p:"100%",c:"c-indigo",i:"🚛"},
    ].map(c=>`<div class="sc ${c.c}"><span class="sc-icon">${c.i}</span><div class="sc-val">${c.v}</div><div class="sc-lbl">${c.l}</div><div class="sc-pct">${c.p}</div></div>`).join('')}
  </div>
  <div class="sec-title fu fu2">KPI Ketersediaan Armada</div>
  <div class="kgrid fu fu2">
    <div class="kc ${kR?'kpass':'kfail'}">
      <div class="kh"><div class="klbl">KPI #1 — Unit Ready</div><span class="badge ${kR?'pass':'fail'}">${kR?'✓ Tercapai':'✗ Tidak Tercapai'}</span></div>
      <div class="knum"><span class="kbig" style="color:${kR?'var(--green)':'var(--red)'}">${pR.toFixed(1)}%</span><span class="ktgt">/ target ≥ ${KPI_R}%</span></div>
      <div class="pt"><div class="pf" id="pf1" style="width:0%;background:${kR?'var(--green)':'var(--red)'}"></div><div class="pm" style="left:${KPI_R}%"></div></div>
      <div class="pl"><span>0%</span><span>target ${KPI_R}%</span><span>100%</span></div>
      <div class="knote ${kR?'pass':'fail'}">${kR?`Surplus <strong>${Math.abs(+gR).toFixed(1)}%</strong> di atas target`:`Kurang <strong>${Math.abs(+gR).toFixed(1)}%</strong> — perlu <strong>+${uGap} unit</strong> ready`}</div>
    </div>
    <div class="kc ${kB?'kpass':'kfail'}">
      <div class="kh"><div class="klbl">KPI #2 — Unit Breakdown</div><span class="badge ${kB?'pass':'fail'}">${kB?'✓ Tercapai':'✗ Tidak Tercapai'}</span></div>
      <div class="knum"><span class="kbig" style="color:${kB?'var(--green)':'var(--red)'}">${pB.toFixed(1)}%</span><span class="ktgt">/ batas maks ≤ ${KPI_B}%</span></div>
      <div class="pt"><div class="pf" id="pf2" style="width:0%;background:${kB?'var(--green)':'var(--red)'}"></div><div class="pm" style="left:${KPI_B*2}%"></div></div>
      <div class="pl"><span>0%</span><span>batas ${KPI_B}%</span><span>50%+</span></div>
      <div class="knote ${kB?'pass':'fail'}">${kB?`Di bawah batas — aman <strong>${Math.abs(+gB).toFixed(1)}%</strong>`:`Melampaui <strong>${Math.abs(+gB).toFixed(1)}%</strong> — kurangi <strong>${bGap} unit</strong> breakdown`}</div>
    </div>
  </div>
  <div class="sec-title fu fu3">Distribusi Armada</div>
  <div class="mgrid fu fu3">
    <div class="card"><h3>Komposisi Status</h3><div style="position:relative;height:195px"><canvas id="donutChart" role="img" aria-label="Komposisi status"></canvas></div></div>
    <div class="card" style="overflow:hidden"><h3>Per Branch Office</h3>
      <div style="position:relative;height:195px"><canvas id="branchChart"></canvas></div>
    </div>
  </div>
  <div class="sec-title fu fu4">Daftar Unit</div>
  <div id="branchFilterBadge" style="display:none;align-items:center;gap:.6rem;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:.55rem 1rem;margin-bottom:.75rem;">
    <span style="font-size:.8rem;color:#1E40AF;font-weight:600" class="bfb-label"></span>
    <button onclick="clearBranchFilter()" style="margin-left:auto;background:#1E2761;color:#fff;border:none;padding:.25rem .7rem;border-radius:6px;font-size:.72rem;cursor:pointer;font-family:inherit">✕ Hapus Filter Branch</button>
  </div>
  <div class="tcard fu fu4" id="tcard-section">
    <div class="fstrip" id="fstrip"></div>
    <table><thead><tr><th>#</th><th>Nopol</th><th>Status</th><th>Branch Office</th><th>Tahun</th><th>Jenis</th><th>Regional</th><th>Bisnis</th><th>Detail Bisnis</th><th>Rute</th></tr></thead>
    <tbody id="tBody"></tbody></table>
    <div class="pgrow"><div class="pginfo" id="pgInfo"></div><div class="pgbtns" id="pgBtns"></div></div>
  </div>`;

  requestAnimationFrame(()=>setTimeout(()=>{
    const p1=document.getElementById("pf1"),p2=document.getElementById("pf2");
    if(p1)p1.style.width=Math.min(pR,100)+"%";
    if(p2)p2.style.width=Math.min(pB*2,100)+"%";
  },80));

  if(donutChart){donutChart.destroy();donutChart=null;}
  if(branchChart){branchChart.destroy();branchChart=null;}
  const ctx=document.getElementById("donutChart");
  if(ctx) donutChart=new Chart(ctx,{
    type:"doughnut",
    data:{labels:["READY","BREAKDOWN","MANGKRAK","LAKA","PROGRES"],
      datasets:[{data:["READY","BREAKDOWN","MANGKRAK","LAKA","PROGRES"].map(l=>bySt[l]||0),
        backgroundColor:["#10B981","#EF4444","#F59E0B","#8B5CF6","#3B82F6"],
        borderWidth:3,borderColor:"#FFFFFF",hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"63%",
      plugins:{legend:{position:"bottom",labels:{color:"#6B7280",font:{size:10,family:"Inter"},padding:8,boxWidth:8}},
        tooltip:{callbacks:{label:c=>`  ${c.raw} unit (${total?(c.raw/total*100).toFixed(1):0}%)`}}}}
  });

  // Branch Office Bar Chart — with click-to-filter
  if(branchChart){branchChart.destroy();branchChart=null;}
  const ctxB=document.getElementById("branchChart");
  if(ctxB && branchSort.length){
    const bLabels=branchSort.map(([b])=>b);
    const bTotal=branchSort.map(([,v])=>v);
    const bBD=branchSort.map(([b])=>bdBranch[b]||0);
    // count per status per branch
    const byStatus=["READY","BREAKDOWN","MANGKRAK","LAKA","PROGRES"].reduce((acc,st)=>{
      acc[st]=branchSort.map(([b])=>allUnits.filter(u=>(u.branch||u.regional||'-')===b&&u.status===st).length);
      return acc;
    },{});
    const stColors={READY:"#10B981",BREAKDOWN:"#EF4444",MANGKRAK:"#F59E0B",LAKA:"#8B5CF6",PROGRES:"#3B82F6"};

    branchChart=new Chart(ctxB,{
      type:"bar",
      data:{
        labels:bLabels,
        datasets:["READY","BREAKDOWN","MANGKRAK","LAKA","PROGRES"].map(st=>({
          label:st,
          data:byStatus[st],
          backgroundColor:stColors[st]+"BB",
          borderColor:stColors[st],
          borderWidth:1,
          stack:"s"
        }))
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        onClick:(e,els)=>{
          if(!els.length){
            // click empty area → reset branch filter
            filterBranch="";
            const sb=document.getElementById("selBranch");
            if(sb) sb.value="";
            updateBranchHighlight(null);
            curPage=1; applyFilter();
            document.getElementById("tcard-section")?.scrollIntoView({behavior:"smooth",block:"start"});
            return;
          }
          const li=els[0].dataIndex;
          const clickedBranch=bLabels[li];
          // toggle: click same branch again → reset
          if(filterBranch===clickedBranch){
            filterBranch="";
            const sb=document.getElementById("selBranch");
            if(sb) sb.value="";
            updateBranchHighlight(null);
          } else {
            filterBranch=clickedBranch;
            const sb=document.getElementById("selBranch");
            if(sb) sb.value=clickedBranch;
            updateBranchHighlight(li);
          }
          curPage=1; applyFilter();
          // scroll ke tabel
          setTimeout(()=>{
            const tbl=document.getElementById("tcard-section")||document.querySelector(".tcard");
            if(tbl) tbl.scrollIntoView({behavior:"smooth",block:"start"});
          },100);
        },
        onHover:(e,els)=>{ e.native.target.style.cursor=els.length?"pointer":"default"; },
        plugins:{
          legend:{position:"bottom",labels:{color:"#6B7280",font:{size:9,family:"Inter"},padding:8,boxWidth:8}},
          tooltip:{
            callbacks:{
              title:(items)=>[`📍 ${items[0].label}`, filterBranch===items[0].label?"(aktif — klik untuk reset)":"(klik untuk filter)"],
              afterBody:(items)=>{
                const br=bLabels[items[0].dataIndex];
                const bd=bdBranch[br]||0;
                const tot=bTotal[items[0].dataIndex];
                const rd=byStatus["READY"][items[0].dataIndex];
                return [`Total: ${tot} unit`,`Ready: ${rd} unit`,bd?`Breakdown: ${bd} unit`:""].filter(Boolean);
              }
            }
          }
        },
        scales:{
          x:{stacked:true,grid:{display:false},ticks:{color:"#6B7280",font:{size:9,family:"Inter"},maxRotation:35}},
          y:{stacked:true,grid:{color:"rgba(0,0,0,.05)"},ticks:{color:"#6B7280",font:{size:9,family:"Inter"}},beginAtZero:true}
        }
      }
    });

    // Apply highlight if filter already active
    const activeIdx=bLabels.indexOf(filterBranch);
    if(activeIdx>=0) updateBranchHighlight(activeIdx);
  }

  function updateBranchHighlight(activeIdx){
    if(!branchChart) return;
    branchChart.data.datasets.forEach(ds=>{
      ds.backgroundColor=ds.backgroundColor.replace(/[0-9A-Fa-f]{2}$/, activeIdx===null?"BB":"44");
      if(activeIdx!==null){
        // restore active bar to full color
        ds.backgroundColor=ds.data.map((_,i)=>
          i===activeIdx ? (ds.borderColor+"BB") : (ds.borderColor+"33")
        );
      }
    });
    branchChart.update("none");
  }

  // Also refresh highlight after applyFilter re-reads branch select
  window._updateBranchHL=updateBranchHighlight;

  const filters=["ALL","READY","BREAKDOWN","MANGKRAK","LAKA","PROGRES"];
  
  // Build unique bisnis/bisnis_detail/rute options
  const bisnisOpts   = [...new Set(allUnits.map(u=>u.bisnis).filter(Boolean))].sort();
  const bisdetOpts   = [...new Set(allUnits.map(u=>u.bisnis_detail).filter(Boolean))].sort();
  const ruteOpts     = [...new Set(allUnits.map(u=>u.rute).filter(Boolean))].sort();
  const branchOpts   = [...new Set(allUnits.map(u=>u.branch).filter(Boolean))].sort();

  document.getElementById("fstrip").innerHTML=
    filters.map(f=>`<button class="fb ${curFilter===f?'on':''}" onclick="setFilter('${f}')">${f} (${f==="ALL"?total:bySt[f]||0})</button>`).join('')+
    `<span style="width:1px;background:var(--border);height:20px;margin:0 4px;display:inline-block;vertical-align:middle"></span>`+
    `<select class="sbox" style="width:auto;padding:.26rem .5rem" id="selBisnis" onchange="applyFilter()">
      <option value="">Semua Bisnis</option>
      ${bisnisOpts.map(b=>`<option value="${b}" ${filterBisnis===b?'selected':''}>${b}</option>`).join('')}
    </select>`+
    (bisdetOpts.length?`<select class="sbox" style="width:auto;padding:.26rem .5rem" id="selBisDet" onchange="applyFilter()">
      <option value="">Semua Detail</option>
      ${bisdetOpts.map(b=>`<option value="${b}" ${filterBisDet===b?'selected':''}>${b}</option>`).join('')}
    </select>`:'<span id="selBisDet" style="display:none"></span>')+
    (ruteOpts.length?`<select class="sbox" style="width:auto;padding:.26rem .5rem" id="selRute" onchange="applyFilter()">
      <option value="">Semua Rute</option>
      ${ruteOpts.map(r=>`<option value="${r}" ${filterRute===r?'selected':''}>${r}</option>`).join('')}
    </select>`:'<span id="selRute" style="display:none"></span>')+
    (branchOpts.length?`<select class="sbox" style="width:auto;padding:.26rem .5rem" id="selBranch" onchange="applyFilter()">
      <option value="">Semua Branch</option>
      ${branchOpts.map(b=>`<option value="${b}" ${filterBranch===b?'selected':''}>${b}</option>`).join('')}
    </select>`:'<span id="selBranch" style="display:none"></span>')+
    `<input class="sbox" style="width:150px" placeholder="Cari nopol..." oninput="onSearch(this.value)" value="${searchQ}"/>`;
  curFilter="ALL";curPage=1;searchQ="";filterBisnis="";filterBisDet="";filterRute="";filterBranch="";applyFilter();
}

function setFilter(f){curFilter=f;curPage=1;document.querySelectorAll(".fb").forEach(b=>b.classList.toggle("on",b.textContent.trim().startsWith(f)));applyFilter();}
function onSearch(v){searchQ=v.toLowerCase();curPage=1;applyFilter();}
function applyFilter(){
  const sb=document.getElementById("selBisnis");
  const sd=document.getElementById("selBisDet");
  const sr=document.getElementById("selRute");
  const sbr=document.getElementById("selBranch");
  if(sb&&sb.tagName==="SELECT") filterBisnis=sb.value;
  if(sd&&sd.tagName==="SELECT") filterBisDet=sd.value;
  if(sr&&sr.tagName==="SELECT") filterRute=sr.value;
  if(sbr&&sbr.tagName==="SELECT") filterBranch=sbr.value;
  let d=allUnits;
  if(curFilter!=="ALL")  d=d.filter(u=>u.status===curFilter);
  if(filterBisnis)       d=d.filter(u=>u.bisnis===filterBisnis);
  if(filterBisDet)       d=d.filter(u=>u.bisnis_detail===filterBisDet);
  if(filterRute)         d=d.filter(u=>u.rute===filterRute);
  if(filterBranch)       d=d.filter(u=>u.branch===filterBranch);
  if(searchQ)            d=d.filter(u=>
    u.nopol.toLowerCase().includes(searchQ)||
    u.regional.toLowerCase().includes(searchQ)||
    u.jenis.toLowerCase().includes(searchQ)
  );
  filteredUnits=d;renderTable();
  // Update branch chart highlight
  if(window._updateBranchHL && branchChart){
    if(filterBranch){
      const bData=branchChart.data.labels;
      const idx=bData?bData.indexOf(filterBranch):-1;
      window._updateBranchHL(idx>=0?idx:null);
    } else {
      window._updateBranchHL(null);
    }
  }
  // Update branch filter badge
  const badge=document.getElementById("branchFilterBadge");
  if(badge){
    if(filterBranch){
      badge.style.display="flex";
      badge.querySelector(".bfb-label").textContent="📍 "+filterBranch;
    } else {
      badge.style.display="none";
    }
  }
}
function renderTable(){
  const tot=filteredUnits.length,pages=Math.max(1,Math.ceil(tot/PG));
  curPage=Math.min(curPage,pages);
  const start=(curPage-1)*PG,slice=filteredUnits.slice(start,start+PG);
  document.getElementById("tBody").innerHTML=slice.map((u,i)=>`
    <tr><td class="d" style="font-size:.65rem">${start+i+1}</td>
    <td style="font-weight:700;font-size:.75rem">${u.nopol}</td>
    <td><span class="pill p${u.status}">${u.status}</span></td>
    <td class="d">${u.branch||'-'}</td><td class="d">${u.tahun||'-'}</td>
    <td class="d">${u.jenis||'-'}</td>
    <td class="d">${u.regional||'-'}</td>
    <td class="d">${u.bisnis||'-'}</td>
    <td class="d">${u.bisnis_detail||'-'}</td>
    <td class="d">${u.rute||'-'}</td>
    </tr>`).join('');
  document.getElementById("pgInfo").textContent=`${start+1}–${Math.min(start+PG,tot)} dari ${tot} unit`;
  let b=`<button class="pgb" onclick="goPage(${curPage-1})" ${curPage===1?"disabled":""}>←</button>`;
  for(let p=Math.max(1,curPage-2);p<=Math.min(pages,curPage+2);p++)
    b+=`<button class="pgb ${p===curPage?'on':''}" onclick="goPage(${p})">${p}</button>`;
  b+=`<button class="pgb" onclick="goPage(${curPage+1})" ${curPage===pages?"disabled":""}>→</button>`;
  document.getElementById("pgBtns").innerHTML=b;
}
function goPage(p){curPage=p;renderTable();}

// ── WORKSHOP TAB ─────────────────────────────────────────
function renderWS(){
  const nPart    = wsUnits.filter(u=>u.progress.includes("PART")).length;
  const nProses  = wsUnits.filter(u=>u.progress.includes("PROSES")||u.progress.includes("PERBAIKAN")).length;
  const nInspek  = wsUnits.filter(u=>u.progress.includes("INSPEKSI")).length;
  const total    = wsUnits.length;

  function dayClass(h){ if(h===null)return""; if(h<=7)return"days-ok"; if(h<=14)return"days-warn"; return"days-over"; }
  function dayLabel(h){ return h===null?"":h===0?"Hari ini":`${h} hari`; }

  function cardClass(u){
    if(u.progress.includes("PART"))return"wc-part";
    if(u.progress.includes("INSPEKSI"))return"wc-inspeksi";
    return"wc-proses";
  }

  function statusBadge(u){
    const k = u.kbmStatus||"";
    if(k==="MANGKRAK") return`<span class="wc-tag" style="background:#FFFBEB;color:#92400E;border-color:#FDE68A">⏸ Mangkrak</span>`;
    if(k==="LAKA")     return`<span class="wc-tag" style="background:#F5F3FF;color:#5B21B6;border-color:#DDD6FE">🔴 Laka</span>`;
    if(k==="PROGRES")  return`<span class="wc-tag" style="background:#EFF6FF;color:#1E40AF;border-color:#BFDBFE">🔄 Progres</span>`;
    return`<span class="wc-tag" style="background:#FEF2F2;color:#991B1B;border-color:#FECACA">⚠ Breakdown</span>`;
  }

  function kanbanCards(units){
    if(!units.length)return`<div class="kb-empty">Tidak ada unit</div>`;
    return units.map(u=>`
      <div class="ws-card ${cardClass(u)}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem">
          <div class="wc-nopol">${u.nopol}</div>
          ${statusBadge(u)}
        </div>
        <div class="wc-jenis">${u.kendaraan||'-'}${u.bengkel?' · '+u.bengkel:''}</div>
        <div class="wc-meta">
          ${u.keluhan?`<span class="wc-tag">⚙ ${u.keluhan}</span>`:''}
          ${u.tgl?`<span class="wc-tag">📅 ${u.tgl}</span>`:''}
          ${u.estimasi?`<span class="wc-tag">🎯 Est: ${u.estimasi}</span>`:''}
          ${u.hari!==null?`<span class="wc-tag ${dayClass(u.hari)}">${dayLabel(u.hari)}</span>`:''}
        </div>
      </div>`).join('');
  }

  const partUnits   = wsUnits.filter(u=>u.progress.includes("PART"));
  const prosesUnits = wsUnits.filter(u=>u.progress.includes("PROSES")||u.progress.includes("PERBAIKAN"));
  const inspekUnits = wsUnits.filter(u=>u.progress.includes("INSPEKSI"));

  // Count by KBM status for summary
  const nBD   = wsUnits.filter(u=>u.kbmStatus==="BREAKDOWN").length;

// Load PptxGenJS dynamically saat dibutuhkan
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (window.PptxGenJS) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Gagal load library PPT. Pastikan ada koneksi internet.'));
    document.head.appendChild(s);
  });
}

async function downloadPPT() {
  const btn = document.getElementById("btnPPT");
  if (btn) { btn.textContent = "⏳ Memuat..."; btn.disabled = true; }

  try {
    // Load PptxGenJS dari CDN
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundled.js');
    await generatePPT();
  } catch(e) {
    // Fallback: coba dari unpkg
    try {
      await loadScript('https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundled.js');
      await generatePPT();
    } catch(e2) {
      alert("Gagal membuat PPT. Pastikan ada koneksi internet lalu coba lagi.\n\nError: " + e2.message);
    }
  } finally {
    if (btn) { btn.textContent = "⬇ Download PPT"; btn.disabled = false; }
  }
}

let chartRegJenis=null, chartJenisTahun=null, chartJenisStatus=null;
// Active drill-down filter state
let analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};
// Global filter for analitik (separate from drill-down)
let aFilterStatus='', aFilterBisnis='', aFilterBisDet='', aFilterBranch='', aFilterSearch='';

function renderAnalitik(){
  if(!allUnits.length) return;

  const regionals = [...new Set(allUnits.map(u=>u.branch||u.regional||'-').filter(b=>b&&b!=='-'))].sort();
  const jenis     = [...new Set(allUnits.map(u=>u.jenis||'-'))].sort();
  const tahuns    = [...new Set(allUnits.map(u=>u.tahun||'-').filter(t=>t&&t!=='-'))].sort();
  const statuses  = ['BREAKDOWN','LAKA','MANGKRAK','PROGRES','READY'];

  function pivot(rowKey, colKey, rows){
    const p={};
    rows.forEach(u=>{
      const r=u[rowKey]||'-', c=u[colKey]||'-';
      if(!p[r]) p[r]={};
      p[r][c]=(p[r][c]||0)+1;
    });
    return p;
  }

  const filteredForAnalitik = getAFiltered();

  const pRegJenis    = pivot('branch','jenis', filteredForAnalitik);
  const pJenisTahun  = pivot('jenis','tahun',    filteredForAnalitik);
  const pJenisStatus = pivot('jenis','status',   filteredForAnalitik);

  function rowTotal(piv,row){ return Object.values(piv[row]||{}).reduce((a,b)=>a+b,0); }
  function colTotal(piv,col,rows){ return rows.reduce((s,r)=>(piv[r]?s+(piv[r][col]||0):s),0); }
  function grandTotal(piv){ return Object.values(piv).reduce((s,obj)=>s+Object.values(obj).reduce((a,b)=>a+b,0),0); }

  // Build pivot table with clickable cells
  function buildTable(piv, rowKeys, colKeys, rowLabel, colLabel, filterType){
    const gT=grandTotal(piv);
    let html=`<div class="pivot-wrap"><table class="pivot-table">
    <thead><tr>
      <th class="row-hdr">${rowLabel} \ ${colLabel}</th>
      ${colKeys.map(c=>`<th>${c}</th>`).join('')}
      <th class="grand">Grand Total</th>
    </tr></thead><tbody>`;
    rowKeys.forEach(r=>{
      const rt=rowTotal(piv,r);
      html+=`<tr><td class="row-label">${r}</td>`;
      colKeys.forEach(c=>{
        const v=(piv[r]&&piv[r][c])||0;
        const isActive = isFilterActive(filterType, r, c);
        html+=v
          ? `<td class="pv-cell${isActive?' pv-active':''}" onclick="drillDown('${filterType}','${r}','${c}')" style="cursor:pointer" title="Klik untuk filter: ${r} + ${c}">${v}</td>`
          : `<td></td>`;
      });
      html+=`<td class="grand" onclick="drillDown('${filterType}','${r}',null)" style="cursor:pointer" title="Filter: ${r}">${rt}</td></tr>`;
    });
    html+=`<tr class="grand-row"><td class="row-label">Grand Total</td>`;
    colKeys.forEach(c=>{ html+=`<td>${colTotal(piv,c,rowKeys)||''}</td>`; });
    html+=`<td>${gT}</td></tr>`;
    html+=`</tbody></table></div>`;
    return html;
  }

  function isFilterActive(type, row, col){
    const f=analitikFilter;
    if(type==='regJenis')    return (f.branch||f.regional)===row && (col===null||f.jenis===col);
    if(type==='jenisTahun')  return f.jenis===row    && (col===null||f.tahun===col);
    if(type==='jenisStatus') return f.jenis===row    && (col===null||f.status===col);
    return false;
  }

  // Rebuild pivot tables only (keep charts)
  function rebuildPivots(){
    const el=document.getElementById('pivot-area');
    if(!el) return;
    el.innerHTML=buildFilterBadge()+
      `<div class="pivot-section"><h3>📊 Branch Office × Jenis Kendaraan</h3>${buildTable(pRegJenis,regionals,jenis,'Branch Office','Jenis Kendaraan','regJenis')}</div>`+
      `<div class="pivot-section"><h3>📅 Jenis Kendaraan × Tahun Kendaraan</h3>${buildTable(pJenisTahun,jenis,tahuns,'Jenis Kendaraan','Tahun','jenisTahun')}</div>`+
      `<div class="pivot-section"><h3>🚦 Jenis Kendaraan × Status</h3>${buildTable(pJenisStatus,jenis,statuses,'Jenis Kendaraan','Status','jenisStatus')}</div>`+
      buildDrillTable();
  }
  window._rebuildPivots = rebuildPivots;

  function buildFilterBadge(){
    const f=analitikFilter;
    const parts=[];
    if(f.jenis)    parts.push(`Jenis: <strong>${f.jenis}</strong>`);
    if(f.status)   parts.push(`Status: <strong>${f.status}</strong>`);
    if(f.branch)   parts.push(`Branch: <strong>${f.branch}</strong>`);
    if(f.regional) parts.push(`Regional: <strong>${f.regional}</strong>`);
    if(f.tahun)    parts.push(`Tahun: <strong>${f.tahun}</strong>`);
    if(!parts.length) return '';
    return `<div class="drill-badge">
      <span>🔍 Filter aktif: ${parts.join(' · ')}</span>
      <button onclick="clearDrill()" class="drill-clear">✕ Hapus filter</button>
    </div>`;
  }

  function buildDrillTable(){
    const f=analitikFilter;
    const hasFilter=f.jenis||f.status||f.regional||f.tahun;
    if(!hasFilter) return '';
    let filtered=allUnits;
    if(f.jenis)    filtered=filtered.filter(u=>u.jenis===f.jenis);
    if(f.status)   filtered=filtered.filter(u=>u.status===f.status);
    if(f.branch)   filtered=filtered.filter(u=>(u.branch||u.regional||'-')===f.branch);
    else if(f.regional) filtered=filtered.filter(u=>u.regional===f.regional);
    if(f.tahun)    filtered=filtered.filter(u=>u.tahun===f.tahun);

    if(!filtered.length) return `<div class="pivot-section"><div class="drill-empty">Tidak ada unit yang sesuai filter.</div></div>`;

    const statusColor={READY:'#065F46',BREAKDOWN:'#991B1B',MANGKRAK:'#92400E',LAKA:'#5B21B6',PROGRES:'#1E40AF'};
    const statusBg={READY:'#ECFDF5',BREAKDOWN:'#FEF2F2',MANGKRAK:'#FFFBEB',LAKA:'#F5F3FF',PROGRES:'#EFF6FF'};

    return `<div class="pivot-section">
      <h3>📋 Daftar Unit (${filtered.length} unit)</h3>
      <div class="pivot-wrap" style="max-height:400px;overflow-y:auto">
        <table class="pivot-table">
          <thead><tr>
            <th style="text-align:center">#</th>
            <th style="text-align:left">Nopol</th>
            <th>Status</th>
            <th style="text-align:left">Regional</th>
            <th>Tahun</th>
            <th style="text-align:left">Jenis</th>
            <th style="text-align:left">Bisnis</th>
          </tr></thead>
          <tbody>
            ${filtered.map((u,i)=>`<tr>
              <td style="color:#6B7280;font-size:.65rem">${i+1}</td>
              <td style="font-weight:700;text-align:left">${u.nopol}</td>
              <td><span style="padding:.15rem .5rem;border-radius:999px;font-size:.65rem;font-weight:700;background:${statusBg[u.status]||'#F3F4F6'};color:${statusColor[u.status]||'#374151'}">${u.status}</span></td>
              <td style="text-align:left;color:#6B7280">${u.regional||'-'}</td>
              <td style="color:#6B7280">${u.tahun||'-'}</td>
              <td style="text-align:left;color:#6B7280">${u.jenis||'-'}</td>
              <td style="text-align:left;color:#6B7280">${u.bisnis||'-'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  document.getElementById('tab-analitik').innerHTML=`
  <!-- ANALITIK FILTER BAR -->
  <div class="a-filterbar">
    <div class="a-filter-left">
      <span class="a-filter-label">Filter:</span>
      ${['','READY','BREAKDOWN','MANGKRAK','LAKA','PROGRES'].map(s=>
        `<button class="afb ${aFilterStatus===s?'on':''}" onclick="setAFilter('status','${s}')">${s||'Semua Status'}</button>`
      ).join('')}
    </div>
    <div class="a-filter-right">
      <select class="a-sel" id="aSelBranch" onchange="setAFilter('branch',this.value)">
        <option value="">Semua Branch</option>
        ${regionals.map(r=>`<option value="${r}" ${aFilterBranch===r?'selected':''}>${r}</option>`).join('')}
      </select>
      <select class="a-sel" id="aSelBisnis" onchange="setAFilter('bisnis',this.value)">
        <option value="">Semua Bisnis</option>
        ${[...new Set(allUnits.map(u=>u.bisnis).filter(Boolean))].sort().map(b=>`<option value="${b}" ${aFilterBisnis===b?'selected':''}>${b}</option>`).join('')}
      </select>
      <select class="a-sel" id="aSelBisDet" onchange="setAFilter('bisdet',this.value)">
        <option value="">Semua Detail</option>
        ${[...new Set(allUnits.map(u=>u.bisnis_detail).filter(Boolean))].sort().map(b=>`<option value="${b}" ${aFilterBisDet===b?'selected':''}>${b}</option>`).join('')}
      </select>
      <input class="a-search" id="aSearch" placeholder="Cari nopol / regional..." oninput="setAFilter('search',this.value)" value="${aFilterSearch}"/>
      ${(aFilterStatus||aFilterBisnis||aFilterBisDet||aFilterBranch||aFilterSearch)?
        `<button class="a-clear" onclick="clearAFilter()">✕ Reset</button>`:''
      }
    </div>
  </div>
  <div id="aFilterInfo" style="${(aFilterStatus||aFilterBisnis||aFilterBisDet||aFilterBranch||aFilterSearch)?'':'display:none'}" class="a-filter-info">
    Menampilkan <strong>${getAFiltered().length}</strong> dari <strong>${allUnits.length}</strong> unit
    ${aFilterStatus?`· Status: <strong>${aFilterStatus}</strong>`:''}
    ${aFilterBranch?`· Branch: <strong>${aFilterBranch}</strong>`:''}
    ${aFilterBisnis?`· Bisnis: <strong>${aFilterBisnis}</strong>`:''}
    ${aFilterBisDet?`· Detail: <strong>${aFilterBisDet}</strong>`:''}
    ${aFilterSearch?`· Cari: <strong>"${aFilterSearch}"</strong>`:''}
  </div>

  <div class="charts-analitik">
    <div class="chart-card-a">
      <h3>Distribusi per Regional Office <span style="font-size:.65rem;color:#9CA3AF;font-weight:400">(klik bar untuk filter)</span></h3>
      <div style="position:relative;height:260px"><canvas id="chartRegJenis"></canvas></div>
    </div>
    <div class="chart-card-a">
      <h3>Jenis Kendaraan per Status <span style="font-size:.65rem;color:#9CA3AF;font-weight:400">(klik bar untuk filter)</span></h3>
      <div style="position:relative;height:260px"><canvas id="chartJenisStatus"></canvas></div>
    </div>
  </div>
  <div class="charts-analitik">
    <div class="chart-card-a" style="grid-column:1/-1">
      <h3>Jenis Kendaraan per Tahun Pengadaan <span style="font-size:.65rem;color:#9CA3AF;font-weight:400">(klik bar untuk filter)</span></h3>
      <div style="position:relative;height:240px"><canvas id="chartJenisTahun"></canvas></div>
    </div>
  </div>
  <div id="pivot-area">
    ${buildFilterBadge()}

    <div class="pivot-section"><h3>📅 Jenis Kendaraan × Tahun Kendaraan</h3>${buildTable(pJenisTahun,jenis,tahuns,'Jenis Kendaraan','Tahun','jenisTahun')}</div>
    <div class="pivot-section"><h3>🚦 Jenis Kendaraan × Status</h3>${buildTable(pJenisStatus,jenis,statuses,'Jenis Kendaraan','Status','jenisStatus')}</div>
    ${buildDrillTable()}
  </div>`;

  // ── Draw Charts with click handlers ──────────────────
  if(chartRegJenis){chartRegJenis.destroy();chartRegJenis=null;}
  if(chartJenisTahun){chartJenisTahun.destroy();chartJenisTahun=null;}
  if(chartJenisStatus){chartJenisStatus.destroy();chartJenisStatus=null;}

  const COLORS=['#1E2761','#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#F97316','#06B6D4','#EC4899','#84CC16','#6366F1'];
  const statusColors={'READY':'#10B981','BREAKDOWN':'#EF4444','MANGKRAK':'#F59E0B','LAKA':'#8B5CF6','PROGRES':'#3B82F6'};

  const clickOpts=(onClickFn)=>({
    onClick:(e,els,chart)=>{
      if(!els.length) return;
      const di=els[0].datasetIndex, li=els[0].index;
      const ds=chart.data.datasets[di].label;
      const lbl=chart.data.labels[li];
      onClickFn(ds,lbl);
    },
    onHover:(e,els)=>{ e.native.target.style.cursor=els.length?'pointer':'default'; }
  });

  // Chart 1: Regional × Jenis — click → filter by regional + jenis
  const ctx1=document.getElementById('chartRegJenis');
  if(ctx1){
    chartRegJenis=new Chart(ctx1,{
      type:'bar',
      data:{labels:regionals,datasets:jenis.map((j,i)=>({label:j,data:regionals.map(r=>(pRegJenis[r]&&pRegJenis[r][j])||0),backgroundColor:COLORS[i%COLORS.length]+'CC',borderColor:COLORS[i%COLORS.length],borderWidth:1}))},
      options:{
        responsive:true,maintainAspectRatio:false,
        ...clickOpts((ds,lbl)=>{ analitikFilter={jenis:ds,status:null,branch:lbl,regional:null,tahun:null}; rebuildPivots(); scrollToPivot(); }),
        plugins:{legend:{position:'bottom',labels:{font:{size:10,family:'Inter'},padding:8,boxWidth:10}},tooltip:{callbacks:{footer:()=>'Klik untuk filter'}}},
        scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10,family:'Inter'},maxRotation:35}},y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10,family:'Inter'}},beginAtZero:true}}
      }
    });
  }

  // Chart 2: Jenis × Status — click → filter by jenis + status
  const ctx2=document.getElementById('chartJenisStatus');
  if(ctx2){
    chartJenisStatus=new Chart(ctx2,{
      type:'bar',
      data:{labels:jenis,datasets:statuses.map(st=>({label:st,data:jenis.map(j=>(pJenisStatus[j]&&pJenisStatus[j][st])||0),backgroundColor:(statusColors[st]||'#6B7280')+'CC',borderColor:statusColors[st]||'#6B7280',borderWidth:1}))},
      options:{
        responsive:true,maintainAspectRatio:false,
        ...clickOpts((ds,lbl)=>{ analitikFilter={jenis:lbl,status:ds,regional:null,tahun:null}; rebuildPivots(); scrollToPivot(); }),
        plugins:{legend:{position:'bottom',labels:{font:{size:10,family:'Inter'},padding:8,boxWidth:10}},tooltip:{callbacks:{footer:()=>'Klik untuk filter'}}},
        scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10,family:'Inter'},maxRotation:35}},y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10,family:'Inter'}},beginAtZero:true}}
      }
    });
  }

  // Chart 3: Jenis × Tahun — click → filter by jenis + tahun
  const ctx3=document.getElementById('chartJenisTahun');
  if(ctx3){
    chartJenisTahun=new Chart(ctx3,{
      type:'bar',
      data:{labels:tahuns,datasets:jenis.map((j,i)=>({label:j,data:tahuns.map(t=>(pJenisTahun[j]&&pJenisTahun[j][t])||0),backgroundColor:COLORS[i%COLORS.length]+'CC',borderColor:COLORS[i%COLORS.length],borderWidth:1}))},
      options:{
        responsive:true,maintainAspectRatio:false,
        ...clickOpts((ds,lbl)=>{ analitikFilter={jenis:ds,status:null,regional:null,tahun:String(lbl)}; rebuildPivots(); scrollToPivot(); }),
        plugins:{legend:{position:'bottom',labels:{font:{size:10,family:'Inter'},padding:8,boxWidth:10}},tooltip:{callbacks:{footer:()=>'Klik untuk filter'}}},
        scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10,family:'Inter'}}},y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10,family:'Inter'}},beginAtZero:true}}
      }
    });
  }

  function scrollToPivot(){
    setTimeout(()=>{ const el=document.getElementById('pivot-area'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },100);
  }
}

function drillDown(type, row, col){
  if(type==='regJenis')    analitikFilter={branch:row, jenis:col||null, status:null, regional:null, tahun:null};
  if(type==='jenisTahun')  analitikFilter={jenis:row,   tahun:col||null, status:null, regional:null};
  if(type==='jenisStatus') analitikFilter={jenis:row,   status:col||null, regional:null, tahun:null};
  const el=document.getElementById('pivot-area');
  if(el){
    // Rebuild pivots — re-render analitik pivots only
    showTab('analitik');
  }
}

function clearDrill(){
  analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};
  renderAnalitik();
}

function setAFilter(type, val){
  if(type==='status')   aFilterStatus=val;
  if(type==='bisnis')   aFilterBisnis=val;
  if(type==='bisdet')   aFilterBisDet=val;
  if(type==='branch')   aFilterBranch=val;
  if(type==='search')   aFilterSearch=val.toLowerCase();
  // Reset drill-down when global filter changes
  analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};
  renderAnalitik();
}

function setFilterBranch(val){filterBranch=val;curPage=1;applyFilter();}
function clearBranchFilter(){
  filterBranch="";
  const sb=document.getElementById("selBranch");
  if(sb) sb.value="";
  if(window._updateBranchHL) window._updateBranchHL(null);
  curPage=1; applyFilter();
}
function clearAFilter(){
  aFilterStatus=''; aFilterBisnis=''; aFilterBisDet=''; aFilterBranch=''; aFilterSearch='';
  analitikFilter={jenis:null,status:null,branch:null,regional:null,tahun:null};
  renderAnalitik();
}

function filterUpdUnits(){
  const q = (document.getElementById('updSearch')?.value||'').toLowerCase();
  const branch = document.getElementById('updSelBranch')?.value||'';
  const status = document.getElementById('updSelStatus')?.value||'';
  const el = document.getElementById('updResults');
  if(!el) return;

  let filtered = allUnits;
  if(branch) filtered = filtered.filter(u=>(u.branch||u.regional||'')===branch);
  if(status) filtered = filtered.filter(u=>u.status===status);
  if(q)      filtered = filtered.filter(u=>
    u.nopol.toLowerCase().includes(q)||
    (u.branch||u.regional||'').toLowerCase().includes(q)||
    (u.jenis||'').toLowerCase().includes(q)
  );

  const show = filtered.slice(0,30);
  if(!show.length){
    el.innerHTML='<div class="empty-hist">Tidak ada unit yang sesuai</div>';
    return;
  }

  const stColor = {READY:'#10B981',BREAKDOWN:'#EF4444',MANGKRAK:'#F59E0B',LAKA:'#8B5CF6',PROGRES:'#3B82F6'};
  el.innerHTML = show.map(u=>`
    <div class="upd-result-item ${updSelected?.nopol===u.nopol?'active':''}" onclick="selectUnit('${u.nopol}')">
      <div>
        <div class="upd-nopol">${u.nopol}</div>
        <div class="upd-meta">${u.branch||u.regional||'-'} · ${u.jenis||'-'} · ${u.tahun||'-'}</div>
      </div>
      <span style="padding:.2rem .6rem;border-radius:999px;font-size:.65rem;font-weight:700;background:${stColor[u.status]}22;color:${stColor[u.status]}">${u.status}</span>
    </div>`).join('');

  if(show.length===30 && filtered.length>30){
    el.innerHTML += `<div style="text-align:center;color:var(--text3);font-size:.75rem;padding:.5rem">...dan ${filtered.length-30} unit lainnya. Persempit pencarian.</div>`;
  }
}

  // Fill unit card
  const stColor = {READY:'#10B981',BREAKDOWN:'#EF4444',MANGKRAK:'#F59E0B',LAKA:'#8B5CF6',PROGRES:'#3B82F6'};
  const u = updSelected;
  document.getElementById('updUnitCard').innerHTML = `
    <div class="uc-row" style="grid-column:1/-1">
      <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem">
        <span style="font-size:1.1rem;font-weight:800;color:var(--text)">${u.nopol}</span>

      </div>
    </div>
    <div class="uc-row"><div class="uc-label">Branch</div><div class="uc-val">${u.branch||u.regional||'-'}</div></div>
    <div class="uc-row"><div class="uc-label">Jenis</div><div class="uc-val">${u.jenis||'-'}</div></div>
    <div class="uc-row"><div class="uc-label">Tahun</div><div class="uc-val">${u.tahun||'-'}</div></div>
    <div class="uc-row"><div class="uc-label">Bisnis</div><div class="uc-val">${u.bisnis||'-'}</div></div>`;

  // Reset status buttons
  ['READY','BREAKDOWN','MANGKRAK','LAKA','PROGRES'].forEach(s=>{
    const btn = document.getElementById('stBtn-'+s);
    if(!btn) return;
    btn.className = 'upd-st-btn' + (s===u.status?' disabled-st':'');
    btn.disabled = (s===u.status);
  });

  document.getElementById('btnSubmitUpd').disabled = true;
  document.getElementById('updWsSection').classList.remove('show');

  // Highlight selected in list
  filterUpdUnits();

  // Scroll to form
  setTimeout(()=>form?.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function selectNewStatus(st){
  if(!updSelected || st===updSelected.status) return;
  updNewStatus = st;

  // Update button styles
  ['READY','BREAKDOWN','MANGKRAK','LAKA','PROGRES'].forEach(s=>{
    const btn = document.getElementById('stBtn-'+s);
    if(!btn) return;
    btn.className = 'upd-st-btn';
    if(s === updSelected.status) btn.className += ' disabled-st';
    else if(s === st) btn.className += ' sel-'+s;
  });

  // Show workshop fields if non-READY
  const wsSection = document.getElementById('updWsSection');
  if(wsSection) wsSection.className = 'upd-ws-section' + (['BREAKDOWN','MANGKRAK','LAKA','PROGRES'].includes(st)?' show':'');

  document.getElementById('btnSubmitUpd').disabled = false;
}

function cancelUpd(){
  updSelected = null;
  updNewStatus = null;
  const form = document.getElementById('updForm');
  if(form) form.style.display='none';
  filterUpdUnits();
}

async function submitUpdate(){
  if(!updSelected || !updNewStatus) return;
  const btn = document.getElementById('btnSubmitUpd');
  const updBy = document.getElementById('updBy')?.value||'';
  const notes = document.getElementById('updNotes')?.value||'';
  const keluhan = document.getElementById('updKeluhan')?.value||'';
  const bengkel = document.getElementById('updBengkel')?.value||'';
  const estSelesai = document.getElementById('updEstSelesai')?.value||'';

  // Save name for next time
  if(updBy) try{localStorage.setItem('updBy',updBy);}catch(e){}

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div> Menyimpan...';

  try {
    // 1. Update status
    const r1 = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'updateStatus',
        nopol: updSelected.nopol,
        newStatus: updNewStatus,
        updatedBy: updBy,
        notes: notes
      })
    });
    const d1 = await r1.json();
    if(!d1.ok) throw new Error(d1.msg);

    // 2. Update workshop data if needed
    if(['BREAKDOWN','MANGKRAK','LAKA','PROGRES'].includes(updNewStatus) && (keluhan||bengkel||estSelesai)){
      await fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'updateWorkshop',
          nopol: updSelected.nopol,
          progress: updNewStatus==='BREAKDOWN'?'MENUNGGU PART':updNewStatus==='LAKA'?'MENUNGGU INSPEKSI':'PROSES PERBAIKAN',
          keluhan, bengkel, estSelesai
        })
      });
    }

    // Update local data immediately
    const u = allUnits.find(u2=>u2.nopol===updSelected.nopol);
    const oldStatus = updSelected.status;
    if(u) u.status = updNewStatus;

    // Add to history
    updHistory.unshift({
      nopol: updSelected.nopol,
      from: oldStatus,
      to: updNewStatus,
      by: updBy||'—',
      time: new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})
    });
    renderHistory();

    showToast('✅ '+updSelected.nopol+' → '+updNewStatus, 'ok');

    // Reset form
    cancelUpd();

    // Refresh dashboard data in background
    setTimeout(()=>loadData(), 1500);

  } catch(err) {
    showToast('❌ Gagal: '+err.message, 'err');
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Simpan Perubahan';
  }
}

function renderHistory(){
  const el = document.getElementById('updHistoryList');
  if(!el) return;
  if(!updHistory.length){
    el.innerHTML='<div class="empty-hist">Belum ada update pada sesi ini</div>';
    return;
  }
  const stColor={READY:'#10B981',BREAKDOWN:'#EF4444',MANGKRAK:'#F59E0B',LAKA:'#8B5CF6',PROGRES:'#3B82F6'};
  el.innerHTML = updHistory.map(h=>`
    <div class="hist-item">
      <div class="hi-nopol">${h.nopol}</div>
      <div class="hi-change">
        <span style="color:${stColor[h.from]||'#6B7280'};font-weight:600">${h.from}</span>
        <span style="color:#9CA3AF"> → </span>
        <span style="color:${stColor[h.to]||'#6B7280'};font-weight:600">${h.to}</span>
        ${h.by&&h.by!=='—'?`<span style="color:#9CA3AF"> · oleh ${h.by}</span>`:''}
      </div>
      <div class="hi-time">⏱ ${h.time}</div>
    </div>`).join('');
}

function showToast(msg, type='ok'){
  const t = document.getElementById('updToast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'upd-toast show '+(type||'');
  setTimeout(()=>t.className='upd-toast', 3000);
}

function getAFiltered(){
  let d=allUnits;
  if(aFilterStatus)   d=d.filter(u=>u.status===aFilterStatus);
  if(aFilterBisnis)   d=d.filter(u=>u.bisnis===aFilterBisnis);
  if(aFilterBisDet)   d=d.filter(u=>u.bisnis_detail===aFilterBisDet);
  if(aFilterBranch)   d=d.filter(u=>(u.branch||u.regional||'-')===aFilterBranch);
  if(aFilterSearch)   d=d.filter(u=>
    u.nopol.toLowerCase().includes(aFilterSearch)||
    (u.branch||u.regional||'').toLowerCase().includes(aFilterSearch)||
    u.jenis.toLowerCase().includes(aFilterSearch)
  );
  return d;
}

loadData();
setInterval(()=>loadData(), REFRESH_MS);
</script>
</body>
</html>
